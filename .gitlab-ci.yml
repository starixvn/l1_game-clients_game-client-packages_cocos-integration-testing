stages:
  - test
  - post-test
  - deploy
  - publish

variables:
  PROJECT_NAME: l1-cocos-integration-tests

include:
  - project: "ci/common-ci"
    ref: master
    file: "npm/publish-npm-ts.gitlab-ci.yml"

publish_npm:
  needs: []
  script:
  - npm install -g npm-cli-login
  - npm-cli-login -u $NPM_LUMI_USER_NAME -p $NPM_LUMI_USER_PASSWORD -e $NPM_LUMI_USER_EMAIL -r $NPM_LUMI_HOST
  - npm set registry $NPM_LUMI_HOST
  - rm -rf node_modules && yarn install --frozen-lockfile
  - yarn install
  - yarn run reg
  - yarn run build
  - npx semantic-release
